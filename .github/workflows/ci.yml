name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --diff .
      - run: mypy packages
      - run: pytest

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Apply migrations and isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/001_control_plane.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/003_m1_domain.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/004_m1_domain_rls.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/001_rls.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/integration/001_m1_domain.sql

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: docker pull python:3.13-slim
      - run: pytest tests/integration/test_sandbox.py
