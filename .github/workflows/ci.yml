name: CI
on:
  push:
    branches: [main, "feature/**", "m1-*", "enterprise-hardening"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages
      - run: pytest
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Apply migrations and isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/001_control_plane.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/003_m1_runs_approvals.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/004_m3_durability.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/005_m4_governance.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/migrations/006_m5_context.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/001_rls.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/002_m1_rls.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/tests/003_m3_durability.sql
