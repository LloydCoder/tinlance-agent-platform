name: CI
on:
  push:
    branches: [main, "feature/**", "m1-*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[test,security]"
      - run: python -m pip check
      - run: python -m compileall -q packages tests
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages
      - run: pytest --cov=packages --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: python -m pip freeze | grep -vE '^(tinlance-agent-platform==|-e )' > /tmp/audit-requirements.txt
      - run: pip-audit --strict -r /tmp/audit-requirements.txt
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
  tsic-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify pinned TSIC ecosystem contract
        run: python scripts/tsic_conformance.py
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply migrations and isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          for test in database/tests/*.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$test"
          done