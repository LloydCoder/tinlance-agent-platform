[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tinlance-agent-platform"
version = "1.1.0"
description = "Tinlance governed agent execution substrate"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["PyJWT[crypto]>=2.15,<3"]

[project.optional-dependencies]
test = ["mypy>=1.17,<3", "pytest>=8.4,<10", "pytest-cov>=7.1,<8", "ruff>=0.12,<1"]
security = ["pip-audit>=2.9,<3", "cyclonedx-bom>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/contracts/src/tinlance_agent_platform_contracts",
  "packages/kernel/src/tinlance_agent_platform_kernel",
  "packages/identity/src/tinlance_agent_platform_identity",
  "packages/tenancy/src/tinlance_agent_platform_tenancy",
  "packages/authorization/src/tinlance_agent_platform_authorization",
  "packages/policy/src/tinlance_agent_platform_policy",
  "packages/agents/src/tinlance_agent_platform_agents",
  "packages/approvals/src/tinlance_agent_platform_approvals",
  "packages/budgets/src/tinlance_agent_platform_budgets",
  "packages/runtime/src/tinlance_agent_platform_runtime",
  "packages/tools/src/tinlance_agent_platform_tools",
  "packages/sandbox/src/tinlance_agent_platform_sandbox",
  "packages/sdk/src/tinlance_agent_platform_domain_sdk",
  "packages/models/src/tinlance_agent_platform_models",
  "packages/orchestration/src/tinlance_agent_platform_orchestration",
  "packages/secrets/src/tinlance_agent_platform_secrets",
  "packages/events/src/tinlance_agent_platform_events",
  "packages/evidence/src/tinlance_agent_platform_evidence",
  "packages/durability/src/tinlance_agent_platform_durability",
  "packages/governance/src/tinlance_agent_platform_governance",
  "packages/context/src/tinlance_agent_platform_context",
  "packages/mcp/src/tinlance_agent_platform_mcp",
  "packages/trajectory/src/tinlance_agent_platform_trajectory",
  "packages/observability/src/tinlance_agent_platform_observability",
  "packages/evaluation/src/tinlance_agent_platform_evaluation",
  "packages/api/src/tinlance_agent_platform_api",
  "packages/multi_agent/src/tinlance_agent_platform_multi_agent",
  "packages/operations/src/tinlance_agent_platform_operations",
  "packages/execution/src/tinlance_agent_platform_execution",
  "packages/risk/src/tinlance_agent_platform_risk",
  "packages/control/src/tinlance_agent_platform_control",
  "packages/registry/src/tinlance_agent_platform_registry",
  "packages/attestation/src/tinlance_agent_platform_attestation",
  "packages/crypto/src/tinlance_agent_platform_crypto",
  "packages/compliance/src/tinlance_agent_platform_compliance",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "tinlance_agent_platform_agents",
  "tinlance_agent_platform_approvals",
  "tinlance_agent_platform_authorization",
  "tinlance_agent_platform_budgets",
  "tinlance_agent_platform_contracts",
  "tinlance_agent_platform_identity",
  "tinlance_agent_platform_kernel",
  "tinlance_agent_platform_policy",
  "tinlance_agent_platform_runtime",
  "tinlance_agent_platform_sandbox",
  "tinlance_agent_platform_tenancy",
  "tinlance_agent_platform_tools",
  "tinlance_agent_platform_models",
  "tinlance_agent_platform_orchestration",
  "tinlance_agent_platform_secrets",
  "tinlance_agent_platform_events",
  "tinlance_agent_platform_evidence",
  "tinlance_agent_platform_durability",
  "tinlance_agent_platform_governance",
  "tinlance_agent_platform_context",
  "tinlance_agent_platform_mcp",
  "tinlance_agent_platform_trajectory",
  "tinlance_agent_platform_observability",
  "tinlance_agent_platform_evaluation",
  "tinlance_agent_platform_api",
  "tinlance_agent_platform_multi_agent",
  "tinlance_agent_platform_operations",
  "tinlance_agent_platform_execution",
  "tinlance_agent_platform_risk",
  "tinlance_agent_platform_control",
  "tinlance_agent_platform_registry",
  "tinlance_agent_platform_attestation",
  "tinlance_agent_platform_crypto",
  "tinlance_agent_platform_compliance",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
