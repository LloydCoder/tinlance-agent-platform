name: R10 Certification

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: r10-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-boundary:
    name: R10 adversarial boundary certification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Run R10 certification suite
        run: python -m pytest tests/certification tests/security/test_adversarial_enterprise.py tests/conformance/test_governed_execution.py tests/conformance/test_enterprise_sequence.py -q
      - name: Lint certification surface
        run: ruff check tests/certification packages/execution packages/approvals packages/tools
      - name: Format certification surface
        run: ruff format --check tests/certification packages/execution packages/approvals packages/tools
