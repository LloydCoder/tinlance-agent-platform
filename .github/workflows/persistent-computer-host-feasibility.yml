name: Persistent Computer Host Feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/sandbox/**"
      - "tests/unit/test_sandbox_host_capabilities.py"
      - "scripts/probe_persistent_computer_host.py"
      - ".github/workflows/persistent-computer-host-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-computer-host-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install test package
        run: python -m pip install -e ".[test]"
      - name: Unit-test host capability gates
        run: pytest -q tests/unit/test_sandbox_host_capabilities.py
      - name: Probe runner without changing host state
        run: sudo "$(which python)" scripts/probe_persistent_computer_host.py --output artifacts/persistent-computer-host.json && sudo chmod 644 artifacts/persistent-computer-host.json
      - name: Record feasibility result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/persistent-computer-host.json").read_text())
          lines = [
              "## Persistent computer host feasibility",
              f"- KVM device present: {report['kvm_device_present']}",
              f"- KVM device accessible: {report['kvm_accessible']}",
              f"- MicroVM ready: {report['microvm_ready']}",
              f"- Container sandbox ready: {report['container_sandbox_ready']}",
              f"- Kernel seccomp filter support: {report['seccomp_filter_supported']}",
              f"- Architecture: {report['architecture']}",
              f"- Kernel: {report['kernel_release']}",
          ]
          if report["microvm_blockers"]:
              lines.append("- MicroVM blockers: " + "; ".join(report["microvm_blockers"]))
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload host feasibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: persistent-computer-host-feasibility-${{ github.run_id }}
          path: artifacts/persistent-computer-host.json
          if-no-files-found: error
          retention-days: 90
