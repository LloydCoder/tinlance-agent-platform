name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.14"
      - name: Install release tooling
        run: python -m pip install --upgrade pip "build>=1.6,<2" "sigstore>=4.5,<5" "cyclonedx-bom>=7,<8"
      - name: Build distributions
        run: python -m build
      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - name: Sign distributions and SBOM
        run: |
          set -euo pipefail
          sigstore sign dist/*
          sigstore sign sbom.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* sbom.json sbom.json.sigstore.json --generate-notes
