[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tinlance-agent-platform"
version = "0.1.0.dev0"
description = "Private governed execution substrate for Tinlance AI agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]
test = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/common/src/tinlance_agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
