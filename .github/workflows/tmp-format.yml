name: Temporary formatter
on:
  workflow_dispatch:
  push:
    branches: [enterprise-hardening]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "ruff>=0.12,<1"
      - run: ruff check --fix . || true
      - run: ruff format .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "chore: format enterprise hardening"
          git push origin HEAD:enterprise-hardening
