name: Persistent Computer gVisor W1 Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/persistent-computer-gvisor-benchmark.yml"
      - "scripts/benchmark_gvisor.py"
      - "tests/unit/test_gvisor_benchmark.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor-w1:
    name: gVisor W1 restricted workload (ephemeral runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test benchmark contract
        run: pytest -q tests/unit/test_gvisor_benchmark.py
      - name: Install pinned gVisor release
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --silent --show-error --location https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases 20261102 main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - name: Pull and pin benchmark image
        id: image
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)"
          case "$image_digest" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Image digest was not returned: $image_digest"; exit 1 ;;
          esac
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "Pinned benchmark image: $image_digest"
      - name: Run three isolated W1 workloads
        run: |
          python scripts/benchmark_gvisor.py --image-digest '${{ steps.image.outputs.image_digest }}' --runs 3 --output artifacts/gvisor-w1.json
      - name: Publish benchmark summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/gvisor-w1.json")
          if not path.exists():
              print("No gVisor benchmark report was produced.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          latency = report["latency"]
          print(f"gVisor: {latency['sample_count']} W1 samples")
          print(f"median={latency['median_ms']:.1f} ms; p95={latency['p95_ms']:.1f} ms; p99={latency['p99_ms']:.1f} ms")
          print(f"Runtime={report['runtime_version']}; image={report['image_digest']}")
          print("Feasibility benchmark only; not production isolation certification.")
          PY
      - name: Upload gVisor benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvisor-w1-benchmark-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
