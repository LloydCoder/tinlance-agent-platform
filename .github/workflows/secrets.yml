name: Secret Scan

on:
  push:
    branches: [main, "feature/**", "feat/**", "phase/p3-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan checked-out filesystem without Git metadata
        run: |
          printf '%s\\n' '(^|/)\\.git(/|$)' > /tmp/trufflehog-excludes.txt
          docker run --rm \\
            -v "${{ github.workspace }}:/workdir:ro" \\
            -v /tmp/trufflehog-excludes.txt:/tmp/trufflehog-excludes.txt:ro \\
            trufflesecurity/trufflehog:3.97.9 \\
            filesystem /workdir --exclude-paths=/tmp/trufflehog-excludes.txt --results=verified,unknown --fail
      - name: Scan checked-out Git history
        env:
          SCAN_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$SCAN_REF"
          git show-ref --verify --quiet "refs/remotes/origin/$SCAN_REF"
          docker run --rm \\
            -v "${{ github.workspace }}:/workdir:ro" \\
            trufflesecurity/trufflehog:3.97.9 \\
            git file:///workdir --branch="origin/$SCAN_REF" --trust-local-git-config --results=verified,unknown --fail
