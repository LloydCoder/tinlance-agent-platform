[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tinlance-agent-platform-reference-agents"
version = "0.1.0"
description = "Reference agents for the governed Tinlance Agent Platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
  "tinlance-agent-platform-sdk @ git+https://github.com/LloydCoder/tinlance-agent-platform-sdk.git@da195be854fc54a77976c4f78ea5093cb957750a",
]

[project.optional-dependencies]
test = [
  "mypy>=1.17,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinlance_reference_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tinlance_reference_agents"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.hatch.metadata]
allow-direct-references = true
