name: Persistent Computer gVisor W1 and W2 Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/persistent-computer-gvisor-benchmark.yml"
      - "scripts/benchmark_gvisor.py"
      - "tests/unit/test_gvisor_benchmark.py"
      - "tests/unit/test_w2_developer_workspace.py"
      - "tests/fixtures/w2-developer-workspace/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor-w1:
    name: gVisor W1 and W2 restricted workloads (ephemeral runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test benchmark contract
        run: pytest -q tests/unit/test_gvisor_benchmark.py tests/unit/test_w2_developer_workspace.py
      - name: Install pinned gVisor release
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --silent --show-error --location https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases 20261102 main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - name: Pull and pin benchmark image
        id: image
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)"
          case "$image_digest" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Image digest was not returned: $image_digest"; exit 1 ;;
          esac
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "Pinned benchmark image: $image_digest"
      - name: Build pinned W2 developer-workspace image
        id: workspace
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE_IMAGE='${{ steps.image.outputs.image_digest }}' \
            --file tests/fixtures/w2-developer-workspace/Dockerfile \
            --tag tinlance-w2-developer-workspace:ci \
            tests/fixtures/w2-developer-workspace
          image_id="$(docker image inspect --format '{{.Id}}' tinlance-w2-developer-workspace:ci)"
          case "$image_id" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "W2 image ID is not content-addressed: $image_id"; exit 1 ;;
          esac
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "W2 developer workspace image: $image_id"
      - name: Run 30 isolated W1 workloads
        run: |
          python scripts/benchmark_gvisor.py --image-digest '${{ steps.image.outputs.image_digest }}' --runs 30 --output artifacts/gvisor-w1.json
      - name: Run 30 isolated W2 developer-workspace workloads
        run: |
          python scripts/benchmark_gvisor.py --image-digest '${{ steps.workspace.outputs.image_id }}' --runs 30 --profile W2 --output artifacts/gvisor-w2.json
      - name: Publish benchmark summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for profile in ("w1", "w2"):
              path = Path(f"artifacts/gvisor-{profile}.json")
              if not path.exists():
                  raise SystemExit(f"Missing gVisor {profile.upper()} benchmark report.")
              report = json.loads(path.read_text(encoding="utf-8"))
              latency = report["latency"]
              print(f"gVisor {profile.upper()}: {latency['sample_count']} samples")
              print(f"median={latency['median_ms']:.1f} ms; p95={latency['p95_ms']:.1f} ms; p99={latency['p99_ms']:.1f} ms")
              print(f"Runtime={report['runtime_version']}; image={report['image_digest']}")
          print("Feasibility benchmark only; not production isolation certification.")
          PY
      - name: Upload gVisor benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gvisor-w1-w2-benchmark-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
