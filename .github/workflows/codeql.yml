name: CodeQL

on:
  push:
    branches: [main, "feature/**", "feat/**", "phase/p3-*"]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:python"
          output: sarif-output

      - name: Retain SARIF for forensic review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-python-sarif-${{ github.run_id }}
          path: sarif-output/python.sarif
          if-no-files-found: ignore
          retention-days: 7
