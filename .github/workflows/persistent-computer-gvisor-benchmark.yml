name: Persistent Computer gVisor W1 Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/persistent-computer-gvisor-benchmark.yml"
      - "scripts/benchmark_gvisor.py"
      - "scripts/normalize_rootfs_tar.py"
      - "tests/unit/test_normalize_rootfs_tar.py"
      - "tests/unit/test_gvisor_benchmark.py"
      - "tests/unit/test_w2_developer_workspace.py"
      - "tests/fixtures/w2-developer-workspace/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor-w1:
    name: gVisor W1 restricted workloads (ephemeral runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test benchmark contract
        run: pytest -q tests/unit/test_gvisor_benchmark.py tests/unit/test_w2_developer_workspace.py
      - name: Install pinned gVisor release
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --silent --show-error --location https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases 20261102 main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - name: Pull and pin benchmark image
        id: image
        run: |
          set -euo pipefail
          image_digest="ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"
          docker pull "$image_digest"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "Pinned benchmark image: $image_digest"
      - name: Run 30 isolated W1 workloads
        run: |
          python scripts/benchmark_gvisor.py --image-digest '${{ steps.image.outputs.image_digest }}' --runs 30 --output artifacts/gvisor-w1.json
      - name: Publish benchmark summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/gvisor-w1.json").read_text(encoding="utf-8"))
          latency = report["latency"]
          assert latency["sample_count"] == 30
          print(f"gVisor W1: {latency['sample_count']} samples")
          print(f"median={latency['median_ms']:.1f} ms; p95={latency['p95_ms']:.1f} ms; p99={latency['p99_ms']:.1f} ms")
          print(f"Runtime={report['runtime_version']}; image={report['image_digest']}")
          print("W2 is executed by the shared-rootfs cross-runtime workflow.")
          PY
      - name: Upload gVisor benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gvisor-w1-benchmark-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
