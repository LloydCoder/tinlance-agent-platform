name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Ruff
        run: ruff check .
      - name: Type check
        run: mypy packages/common/src
      - name: Tests
        run: pytest
