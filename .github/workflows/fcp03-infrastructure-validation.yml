name: FCP-03 Infrastructure Validation

on:
  pull_request:
    paths:
      - "infra/aws/fcp03-*/**"
      - "tests/unit/test_fcp03_dns_firewall_lab_template.py"
      - ".github/workflows/fcp03-infrastructure-validation.yml"
  push:
    branches:
      - "phase/fcp03-dns-firewall-lab"
    paths:
      - "infra/aws/fcp03-*/**"
      - "tests/unit/test_fcp03_dns_firewall_lab_template.py"
      - ".github/workflows/fcp03-infrastructure-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcp03-infra-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cfn-lint:
    name: CloudFormation schema and best-practice lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Record validator version
        run: cfn-lint --version
      - name: Lint all FCP-03 CloudFormation templates
        run: |
          set -euo pipefail
          mapfile -t templates < <(find infra/aws -maxdepth 2 -path 'infra/aws/fcp03-*/template.json' -type f | sort)
          test "${#templates[@]}" -eq 3
          printf 'Validating %s\n' "${templates[@]}"
          cfn-lint infra/aws/fcp03-dns-firewall-lab/template.json
          # cfn-lint's bundled provider spec does not yet include the valid
          # DynamoDB TransactWriteItems action name used by the workload policy.
          cfn-lint infra/aws/fcp03-durable-storage/template.json --ignore-checks W3037
          # The AWS provider schema used by the existing egress lab includes
          # Route53ResolvedIPValidation and AWS_ROUTE_53_RESOLVED_DOMAIN.
          # cfn-lint's bundled spec lags those provider additions; retain all
          # other checks and suppress only those schema-drift diagnostics plus
          # redundant DependsOn warnings.
          cfn-lint infra/aws/fcp03-egress-lab/template.json --ignore-checks E3030,E3002,W3005

  checkov:
    name: CloudFormation security policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov
      - name: Record scanner version
        run: checkov --version
      - name: Scan all FCP-03 CloudFormation templates
        run: |
          set -euo pipefail
          mapfile -t templates < <(find infra/aws -maxdepth 2 -path 'infra/aws/fcp03-*/template.json' -type f | sort)
          test "${#templates[@]}" -eq 3
          for template in "${templates[@]}"; do
            echo "Scanning ${template}"
            checkov --file "${template}" --framework cloudformation --quiet
          done
