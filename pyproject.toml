[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tinlance-agent-platform"
version = "0.3.0.dev0"
description = "Tinlance governed agent execution substrate"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["mypy>=1.17,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/contracts/src/tinlance_agent_platform_contracts",
  "packages/kernel/src/tinlance_agent_platform_kernel",
  "packages/identity/src/tinlance_agent_platform_identity",
  "packages/tenancy/src/tinlance_agent_platform_tenancy",
  "packages/authorization/src/tinlance_agent_platform_authorization",
  "packages/policy/src/tinlance_agent_platform_policy",
  "packages/domain/src/tinlance_agent_platform_domain",
  "packages/persistence/src/tinlance_agent_platform_persistence",
  "packages/sandbox/src/tinlance_agent_platform_sandbox",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "tinlance_agent_platform_authorization",
  "tinlance_agent_platform_contracts",
  "tinlance_agent_platform_domain",
  "tinlance_agent_platform_identity",
  "tinlance_agent_platform_kernel",
  "tinlance_agent_platform_persistence",
  "tinlance_agent_platform_policy",
  "tinlance_agent_platform_sandbox",
  "tinlance_agent_platform_tenancy",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
