name: Persistent Computer Firecracker W2 Developer Workspace

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/persistent-computer-firecracker-w2.yml"
      - "scripts/__init__.py"
      - "scripts/probe_persistent_computer_host.py"
      - "scripts/smoke_firecracker_guest_boot.py"
      - "scripts/normalize_rootfs_tar.py"
      - "scripts/smoke_firecracker_jailer.py"
      - "tests/unit/test_firecracker_jailer.py"
      - "tests/unit/test_normalize_rootfs_tar.py"
      - "tests/fixtures/firecracker-guest-assets.json"
      - "tests/unit/test_firecracker_guest_boot.py"
      - "tests/fixtures/w2-developer-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-computer-guest-boot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-boot:
    name: KVM W2 developer workspace (ephemeral runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test guest boot evidence helpers
        run: pytest -q tests/unit/test_firecracker_guest_boot.py tests/unit/test_normalize_rootfs_tar.py

      - name: Verify KVM and resource-control prerequisites
        run: |
          mkdir -p artifacts
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/packages/sandbox/src:$GITHUB_WORKSPACE/packages/contracts/src" python scripts/probe_persistent_computer_host.py --output artifacts/host.json
          sudo chmod 644 artifacts/host.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/host.json").read_text(encoding="utf-8"))
          required = {
              "microvm_ready": report.get("microvm_ready") is True,
              "kvm_accessible": report.get("kvm_accessible") is True,
              "cpu_virtualization": report.get("cpu_virtualization") is True,
              "cgroup_limits_ready": report.get("cgroup_limits_ready") is True,
              "seccomp_filter_supported": report.get("seccomp_filter_supported") is True,
          }
          failed = [name for name, passed in required.items() if not passed]
          if failed:
              raise SystemExit(f"KVM guest boot prerequisites unavailable: {failed}; report={report}")
          print("KVM, CPU virtualization, cgroup quota controllers and seccomp-filter prerequisites passed")
          PY

      - name: Download and verify pinned Firecracker release
        run: |
          set -euo pipefail
          version="1.17.0"
          arch="x86_64"
          archive="/tmp/firecracker-v${version}-${arch}.tgz"
          expected_sha="06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558"
          direct_url="https://github.com/firecracker-microvm/firecracker/releases/download/v${version}/firecracker-v${version}-${arch}.tgz"
          api_url="https://api.github.com/repos/firecracker-microvm/firecracker/releases/assets/555159508"
          downloaded=0
          for url in "$direct_url" "$api_url"; do
            if curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 900 \
              --connect-timeout 30 --max-time 900 \
              -H "Accept: application/octet-stream" "$url" --output "$archive"; then
              downloaded=1
              break
            fi
            rm -f "$archive"
          done
          test "$downloaded" -eq 1
          echo "${expected_sha}  ${archive}" | sha256sum --check -
          mkdir -p /tmp/firecracker-release
          tar -xzf "${archive}" -C /tmp/firecracker-release
          firecracker_bin="$(find /tmp/firecracker-release -type f -name "firecracker-v${version}-${arch}" -print -quit)"
          test -n "${firecracker_bin}"
          echo "FIRECRACKER_BIN=${firecracker_bin}" >> "${GITHUB_ENV}"
          echo "FIRECRACKER_ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Install guest image tooling
        run: |
          if ! command -v mkfs.ext4 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y e2fsprogs
          fi

      - name: Build digest-pinned W2 developer image and export rootfs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          install -m 0600 /etc/ssl/certs/ca-certificates.crt /tmp/tinlance-ca-bundle.crt
          test -s /tmp/tinlance-ca-bundle.crt
          test ! -L /tmp/tinlance-ca-bundle.crt
          trap 'rm -f /tmp/tinlance-ca-bundle.crt' EXIT
          base_digest="ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"
          docker pull --platform linux/amd64 "$base_digest"
          docker_engine_version="$(docker version --format '{{.Server.Version}}')"
          buildx_version="$(docker buildx version | awk '{print $2}')"
          ca_bundle_sha256="$(sha256sum /tmp/tinlance-ca-bundle.crt | awk '{print $1}')"
          docker build --platform=linux/amd64 --pull --no-cache \
            --secret id=ca_bundle,src=/tmp/tinlance-ca-bundle.crt \
            --build-arg BASE_IMAGE="$base_digest" \
            --build-arg APT_SNAPSHOT=20261106T000000Z \
            --file tests/fixtures/w2-developer-workspace/Dockerfile \
            --tag tinlance-w2-developer-workspace:firecracker \
            tests/fixtures/w2-developer-workspace
          image_id="$(docker image inspect --format '{{.Id}}' tinlance-w2-developer-workspace:firecracker)"
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")"
          test "$image_platform" = "linux/amd64"
          case "$image_id" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "W2 image ID is not content-addressed: $image_id"; exit 1 ;;
          esac
          container_id="$(docker create "$image_id")"
          docker export --output artifacts/w2-rootfs.raw.tar "$container_id"
          docker rm "$container_id"
          python scripts/normalize_rootfs_tar.py --input artifacts/w2-rootfs.raw.tar --output artifacts/w2-rootfs.tar
          rootfs_sha256="$(sha256sum artifacts/w2-rootfs.tar | awk '{print $1}')"

          docker build --platform=linux/amd64 --pull --no-cache \
            --secret id=ca_bundle,src=/tmp/tinlance-ca-bundle.crt \
            --build-arg BASE_IMAGE="$base_digest" \
            --build-arg APT_SNAPSHOT=20261106T000000Z \
            --file tests/fixtures/w2-developer-workspace/Dockerfile \
            --tag tinlance-w2-developer-workspace:rebuild \
            tests/fixtures/w2-developer-workspace
          rebuild_image_id="$(docker image inspect --format '{{.Id}}' tinlance-w2-developer-workspace:rebuild)"
          rebuild_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$rebuild_image_id")"
          test "$rebuild_platform" = "$image_platform"
          case "$rebuild_image_id" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Independent W2 rebuild image ID is not content-addressed: $rebuild_image_id"; exit 1 ;;
          esac
          rebuild_container_id="$(docker create "$rebuild_image_id")"
          docker export --output artifacts/w2-rootfs.rebuild.raw.tar "$rebuild_container_id"
          docker rm "$rebuild_container_id"
          python scripts/normalize_rootfs_tar.py --input artifacts/w2-rootfs.rebuild.raw.tar --output artifacts/w2-rootfs.rebuild.tar
          rebuild_sha256="$(sha256sum artifacts/w2-rootfs.rebuild.tar | awk '{print $1}')"
          if ! cmp --silent artifacts/w2-rootfs.tar artifacts/w2-rootfs.rebuild.tar; then
            echo "Independent W2 image builds produced different normalized rootfs archives."
            echo "primary=$rootfs_sha256 rebuild=$rebuild_sha256"
            exit 1
          fi
          printf '%s\n' "$rootfs_sha256" > artifacts/w2-rootfs.sha256
          python - <<PY
          import json
          from pathlib import Path

          report = {
              "base_image_digest": "$base_digest",
              "platform": "$image_platform",
              "docker_engine_version": "$docker_engine_version",
              "buildx_version": "$buildx_version",
              "ca_bundle_sha256": "$ca_bundle_sha256",
              "apt_snapshot": "20261106T000000Z",
              "build_cache_disabled": True,
              "primary_image_id": "$image_id",
              "rebuild_image_id": "$rebuild_image_id",
              "primary_rootfs_sha256": "$rootfs_sha256",
              "rebuild_rootfs_sha256": "$rebuild_sha256",
              "byte_identical": True,
          }
          Path("artifacts/w2-rootfs-reproducibility.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f artifacts/w2-rootfs.raw.tar artifacts/w2-rootfs.rebuild.raw.tar artifacts/w2-rootfs.rebuild.tar
          docker image rm tinlance-w2-developer-workspace:firecracker tinlance-w2-developer-workspace:rebuild
          echo "W2 base image: $base_digest"
          echo "W2 image ID: $image_id"
          echo "W2 normalized rootfs tar SHA-256: $rootfs_sha256"
          {
            echo "W2_BASE_IMAGE_DIGEST=$base_digest"
            echo "W2_IMAGE_ID=$image_id"
            echo "W2_ROOTFS_TAR=artifacts/w2-rootfs.tar"
          } >> "$GITHUB_ENV"

      - name: Boot 30 network-disconnected W2 developer-workspace guest instances
        run: |
          set -euo pipefail
          python scripts/smoke_firecracker_guest_boot.py \
            --firecracker "${FIRECRACKER_BIN}" \
            --firecracker-archive "${FIRECRACKER_ARCHIVE}" \
            --assets-manifest tests/fixtures/firecracker-guest-assets.json \
            --runs 30 --profile W2 \
            --w2-rootfs-tar "$W2_ROOTFS_TAR" \
            --w2-image-id "$W2_IMAGE_ID" \
            --w2-base-image-digest "$W2_BASE_IMAGE_DIGEST" \
            --timeout-seconds 60 \
            --output artifacts/firecracker-w2.json \
            --log-dir artifacts/firecracker-w2-logs

      - name: Publish guest boot summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/firecracker-w2.json")
          if not report_path.is_file():
              print("::warning::Firecracker W2 report is unavailable because an earlier prerequisite failed; no guest acceptance is claimed.")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          reproducibility_path = Path("artifacts/w2-rootfs-reproducibility.json")
          if not reproducibility_path.is_file():
              print("::warning::W2 reproducibility evidence is unavailable because an earlier build step failed.")
              raise SystemExit(0)
          reproducibility = json.loads(reproducibility_path.read_text(encoding="utf-8"))
          if (
              reproducibility.get("byte_identical") is not True
              or reproducibility.get("primary_rootfs_sha256")
              != reproducibility.get("rebuild_rootfs_sha256")
              or report.get("w2_rootfs_tar_sha256")
              != reproducibility.get("primary_rootfs_sha256")
          ):
              raise SystemExit("Independent W2 rootfs builds are not byte-identical.")
          if report.get("sample_count") != 30:
              raise SystemExit(f"Expected exactly 30 W2 guest boots, got {report.get('sample_count')!r}")
          if report.get("w2_rootfs_tar_sha256") is None:
              raise SystemExit("W2 rootfs export digest is missing from guest evidence.")
          markers = report.get("guest_isolation_checks", [])
          if len(markers) != 30 or any(not item.get("developer_workspace_passed") for item in markers):
              raise SystemExit("All 30 guest boots must prove developer-workspace completion.")
          summary = (
              f"Firecracker {report['firecracker_version']}: "
              f"{report['sample_count']} guest boots; "
              f"median={report['median_boot_time_ms']:.1f} ms; "
              f"max={report['max_boot_time_ms']:.1f} ms"
          )
          if "p95_boot_time_ms" in report and "p99_boot_time_ms" in report:
              summary += (
                  f"; p95={report['p95_boot_time_ms']:.1f} ms"
                  f"; p99={report['p99_boot_time_ms']:.1f} ms"
              )
          print(summary)
          print(
              f"Kernel SHA-256={report['guest_kernel_sha256']}; "
              f"rootfs SHA-256={report['guest_rootfs_ext4_sha256']}"
          )
          print(f"Guest workload: {report['guest_workload']}")
          print(f"W2 base image={report['w2_base_image_digest']}; image ID={report['w2_image_id']}")
          print(f"W2 normalized rootfs tar SHA-256={report['w2_rootfs_tar_sha256']}")
          print("Direct VMM feasibility benchmark only: jailer/production isolation not certified.")
          PY

      - name: Upload guest boot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firecracker-w2-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

  gvisor-w2:
    name: gVisor W2 developer workspace (shared normalized rootfs)
    needs: guest-boot
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[test]"
      - name: Download the Firecracker-built normalized rootfs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: firecracker-w2-${{ github.run_id }}
          path: artifacts/
      - name: Install pinned gVisor release
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --silent --show-error --location https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases 20261102 main" | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
      - name: Import the shared normalized rootfs
        id: workspace
        run: |
          set -euo pipefail
          test -s artifacts/w2-rootfs.tar
          rootfs_sha256="$(cat artifacts/w2-rootfs.sha256)"
          test "$(sha256sum artifacts/w2-rootfs.tar | awk '{print $1}')" = "$rootfs_sha256"
          docker import \
            --change "LABEL org.tinlance.w2.rootfs.tar.sha256=$rootfs_sha256" \
            --change "USER 65532:65532" \
            --change "WORKDIR /tmp" \
            artifacts/w2-rootfs.tar tinlance-w2-developer-workspace:normalized
          image_id="$(docker image inspect --format '{{.Id}}' tinlance-w2-developer-workspace:normalized)"
          imported_rootfs_sha256="$(docker image inspect --format '{{index .Config.Labels "org.tinlance.w2.rootfs.tar.sha256"}}' "$image_id")"
          test "$imported_rootfs_sha256" = "$rootfs_sha256"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "rootfs_sha256=sha256:$rootfs_sha256" >> "$GITHUB_OUTPUT"
      - name: Run 30 isolated gVisor W2 workloads
        run: |
          python scripts/benchmark_gvisor.py \
            --image-digest '${{ steps.workspace.outputs.image_id }}' \
            --runs 30 --profile W2 \
            --rootfs-sha256 '${{ steps.workspace.outputs.rootfs_sha256 }}' \
            --output artifacts/gvisor-w2.json
      - name: Verify shared-rootfs benchmark evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "sha256:" + Path("artifacts/w2-rootfs.sha256").read_text(encoding="utf-8").strip()
          report = json.loads(Path("artifacts/gvisor-w2.json").read_text(encoding="utf-8"))
          assert report["rootfs_tar_sha256"] == expected
          assert report["latency"]["sample_count"] == 30
          assert report["guest_assertions"]["git_clone_and_repository_metadata"] is True
          print(f"gVisor W2: 30 samples; shared rootfs {expected}")
          PY
      - name: Upload gVisor W2 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gvisor-w2-${{ github.run_id }}
          path: artifacts/gvisor-w2.json
          if-no-files-found: warn
          retention-days: 90

  kata-w2:
    name: Kata W2 developer workspace (shared normalized rootfs)
    needs: guest-boot
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify KVM prerequisites
        run: |
          test -c /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          grep -E -q '(vmx|svm)' /proc/cpuinfo
      - name: Download the Firecracker-built normalized rootfs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: firecracker-w2-${{ github.run_id }}
          path: artifacts/
      - name: Download and verify Kata Containers 4.3.1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          archive=/tmp/kata-static-4.3.1-amd64.tar.zst
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            https://github.com/kata-containers/kata-containers/releases/download/4.3.1/kata-static-4.3.1-amd64.tar.zst \
            --output "$archive"
          echo "1463a2b86845f4d3d8e87f2f764ec59856fc0fee3520967a79ade32762be2e97  $archive" | sha256sum --check -
          sudo tar --zstd -xf "$archive" -C /
          test -x /opt/kata/runtime-rs/bin/containerd-shim-kata-v2
          test -f /opt/kata/share/defaults/kata-containers/runtime-rs/configuration-qemu-runtime-rs.toml
      - name: Register Kata runtime with Docker
        run: |
          set -euo pipefail
          sudo python - <<'PY'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          runtimes = config.setdefault("runtimes", {})
          kata_config = Path("/etc/kata-containers/configuration.toml")
          kata_config.parent.mkdir(parents=True, exist_ok=True)
          kata_config.write_bytes(
              Path("/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-qemu-runtime-rs.toml").read_bytes()
          )
          runtimes["kata"] = {
              "runtimeType": "/opt/kata/runtime-rs/bin/containerd-shim-kata-v2"
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config, indent=2) + chr(10), encoding="utf-8")
          PY
          sudo dockerd --validate --config-file=/etc/docker/daemon.json
          if ! sudo systemctl restart docker; then
            sudo systemctl status docker.service --no-pager || true
            sudo journalctl -u docker.service -n 100 --no-pager || true
            exit 1
          fi
          docker info --format '{{json .Runtimes}}'
      - name: Import the shared normalized rootfs
        id: workspace
        run: |
          set -euo pipefail
          test -s artifacts/w2-rootfs.tar
          rootfs_sha256="$(cat artifacts/w2-rootfs.sha256)"
          test "$(sha256sum artifacts/w2-rootfs.tar | awk '{print $1}')" = "$rootfs_sha256"
          docker import \
            --change "LABEL org.tinlance.w2.rootfs.tar.sha256=$rootfs_sha256" \
            --change "USER 65532:65532" \
            --change "WORKDIR /tmp" \
            artifacts/w2-rootfs.tar tinlance-w2-developer-workspace:normalized
          image_id="$(docker image inspect --format '{{.Id}}' tinlance-w2-developer-workspace:normalized)"
          imported_rootfs_sha256="$(docker image inspect --format '{{index .Config.Labels "org.tinlance.w2.rootfs.tar.sha256"}}' "$image_id")"
          test "$imported_rootfs_sha256" = "$rootfs_sha256"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "rootfs_sha256=sha256:$rootfs_sha256" >> "$GITHUB_OUTPUT"
      - name: Prove Kata launches a separate guest kernel
        run: |
          host_kernel="$(uname -r)"
          base_digest="ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"
          docker pull "$base_digest"
          guest_kernel="$(docker run --rm --runtime kata --network none "$base_digest" uname -r)"
          test -n "$guest_kernel"
          test "$guest_kernel" != "$host_kernel"
      - name: Run 30 restricted Kata W2 workloads
        run: |
          python scripts/benchmark_gvisor.py \
            --image-digest '${{ steps.workspace.outputs.image_id }}' \
            --runs 30 --runtime-name kata \
            --runtime-version "Kata Containers 4.3.1 runtime-rs with QEMU" \
            --candidate kata-qemu-runtime-rs --profile W2 \
            --rootfs-sha256 '${{ steps.workspace.outputs.rootfs_sha256 }}' \
            --output artifacts/kata-w2.json
      - name: Verify shared-rootfs benchmark evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = "sha256:" + Path("artifacts/w2-rootfs.sha256").read_text(encoding="utf-8").strip()
          report = json.loads(Path("artifacts/kata-w2.json").read_text(encoding="utf-8"))
          assert report["rootfs_tar_sha256"] == expected
          assert report["latency"]["sample_count"] == 30
          assert report["guest_assertions"]["git_clone_and_repository_metadata"] is True
          print(f"Kata W2: 30 samples; shared rootfs {expected}")
          PY
      - name: Upload Kata W2 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kata-w2-${{ github.run_id }}
          path: artifacts/kata-w2.json
          if-no-files-found: warn
          retention-days: 90

  firecracker-jailer-w2:
    name: Firecracker W2 developer workspace through jailer
    needs: guest-boot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Test jailer and W2 profile contracts
        run: pytest -q tests/unit/test_firecracker_jailer.py tests/unit/test_normalize_rootfs_tar.py

      - name: Download the exact W2 normalized rootfs and provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: firecracker-w2-${{ github.run_id }}
          path: artifacts/

      - name: Verify shared rootfs and extract immutable image provenance
        run: |
          set -euo pipefail
          test -s artifacts/w2-rootfs.tar
          expected_sha="$(cat artifacts/w2-rootfs.sha256)"
          actual_sha="$(sha256sum artifacts/w2-rootfs.tar | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/firecracker-w2.json").read_text(encoding="utf-8"))
          expected = Path("artifacts/w2-rootfs.sha256").read_text(encoding="utf-8").strip()
          if report.get("w2_rootfs_tar_sha256") != expected:
              raise SystemExit("Firecracker W2 report does not match the downloaded normalized rootfs")
          if report.get("sample_count") != 30:
              raise SystemExit("The source W2 artifact must contain all 30 direct guest samples")
          print(f"W2_BASE_IMAGE_DIGEST={report['w2_base_image_digest']}")
          print(f"W2_IMAGE_ID={report['w2_image_id']}")
          PY

      - name: Verify KVM and resource-control prerequisites
        run: |
          set -euo pipefail
          sudo env PYTHONPATH="$GITHUB_WORKSPACE/packages/sandbox/src:$GITHUB_WORKSPACE/packages/contracts/src" python scripts/probe_persistent_computer_host.py --output artifacts/jailer-host.json
          sudo chmod 644 artifacts/jailer-host.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/jailer-host.json").read_text(encoding="utf-8"))
          required = {
              "microvm_ready": report.get("microvm_ready") is True,
              "kvm_accessible": report.get("kvm_accessible") is True,
              "cpu_virtualization": report.get("cpu_virtualization") is True,
              "cgroup_limits_ready": report.get("cgroup_limits_ready") is True,
              "seccomp_filter_supported": report.get("seccomp_filter_supported") is True,
          }
          failed = [name for name, passed in required.items() if not passed]
          if failed:
              raise SystemExit(f"jailed W2 prerequisites unavailable: {failed}; report={report}")
          PY

      - name: Download and verify pinned Firecracker release
        run: |
          set -euo pipefail
          version="1.17.0"
          arch="x86_64"
          archive="/tmp/firecracker-v${version}-${arch}.tgz"
          expected_sha="06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            "https://github.com/firecracker-microvm/firecracker/releases/download/v${version}/firecracker-v${version}-${arch}.tgz" \
            --output "${archive}"
          echo "${expected_sha}  ${archive}" | sha256sum --check -
          mkdir -p /tmp/firecracker-release
          tar -xzf "${archive}" -C /tmp/firecracker-release
          firecracker_bin="$(find /tmp/firecracker-release -type f -name "firecracker-v${version}-${arch}" -print -quit)"
          jailer_bin="$(find /tmp/firecracker-release -type f -name "jailer-v${version}-${arch}" -print -quit)"
          test -n "${firecracker_bin}"
          test -n "${jailer_bin}"
          sudo install -d -o root -g root -m 0755 /usr/local/libexec/firecracker/${version}
          sudo install -o root -g root -m 0755 "${firecracker_bin}" /usr/local/libexec/firecracker/${version}/firecracker
          sudo install -o root -g root -m 0755 "${jailer_bin}" /usr/local/libexec/firecracker/${version}/jailer
          echo "FIRECRACKER_BIN=/usr/local/libexec/firecracker/${version}/firecracker" >> "${GITHUB_ENV}"
          echo "JAILER_BIN=/usr/local/libexec/firecracker/${version}/jailer" >> "${GITHUB_ENV}"
          echo "FIRECRACKER_ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Create dedicated unprivileged jailer identity
        run: |
          set -euo pipefail
          user="tinlance-fc-w2-${GITHUB_RUN_ID}"
          sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin "${user}"
          echo "JAILER_UID=$(id -u "${user}")" >> "${GITHUB_ENV}"
          echo "JAILER_GID=$(id -g "${user}")" >> "${GITHUB_ENV}"
          sudo install -d -o root -g root -m 0755 /srv/tinlance-jailer-w2

      - name: Install guest filesystem and network namespace tooling
        run: |
          set -euo pipefail
          if ! command -v mkfs.ext4 >/dev/null 2>&1 || ! command -v ip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y e2fsprogs iproute2
          fi

      - name: Create dedicated loopback-only network namespace
        run: |
          set -euo pipefail
          namespace="tinlance-fc-w2-${GITHUB_RUN_ID}"
          sudo ip netns add "${namespace}"
          sudo ip -n "${namespace}" link set lo up
          interfaces="$(sudo ip -n "${namespace}" -o link show | awk -F': ' '{print $2}' | cut -d'@' -f1 | sort)"
          test "${interfaces}" = "lo"
          namespace_path="/var/run/netns/${namespace}"
          sudo test -e "${namespace_path}"
          sudo test ! -L "${namespace_path}"
          python - "${namespace_path}" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path
          handle = Path(sys.argv[1])
          for path in (handle, handle.parent):
              info = os.stat(path)
              if info.st_uid != 0 or info.st_gid != 0:
                  raise SystemExit(f"network namespace path is not root-owned: {path}")
              if info.st_mode & (stat.S_IWGRP | stat.S_IWOTH):
                  raise SystemExit(f"network namespace path is group/world writable: {path}")
          PY
          echo "NETWORK_NAMESPACE_PATH=${namespace_path}" >> "${GITHUB_ENV}"

      - name: Boot three W2 developer workspaces through the Firecracker jailer
        run: |
          set -euo pipefail
          python -m scripts.smoke_firecracker_jailer \
            --jailer "${JAILER_BIN}" \
            --firecracker "${FIRECRACKER_BIN}" \
            --firecracker-archive "${FIRECRACKER_ARCHIVE}" \
            --assets-manifest tests/fixtures/firecracker-guest-assets.json \
            --uid "${JAILER_UID}" \
            --gid "${JAILER_GID}" \
            --chroot-base-dir /srv/tinlance-jailer-w2 \
            --profile W2 \
            --network-namespace-path "${NETWORK_NAMESPACE_PATH}" \
            --w2-rootfs-tar artifacts/w2-rootfs.tar \
            --w2-image-id "${W2_IMAGE_ID}" \
            --w2-base-image-digest "${W2_BASE_IMAGE_DIGEST}" \
            --runs 3 \
            --timeout-seconds 75 \
            --output artifacts/firecracker-jailer-w2.json \
            --log-dir artifacts/firecracker-jailer-w2-logs

      - name: Verify every jailed W2 workload and host confinement evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("artifacts/firecracker-jailer-w2.json")
          if not report_path.is_file():
              raise SystemExit("Required jailed W2 evidence is missing.")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("status") != "passed" or report.get("profile") != "W2":
              raise SystemExit("Jailer report does not certify a successful W2 execution.")
          if report.get("jailer_executed") is not True or report.get("production_certification") is not False:
              raise SystemExit("Jailer execution mode or production-certification boundary is invalid.")
          if report.get("sample_count") != 3:
              raise SystemExit("Exactly three jailed W2 workloads are required.")
          guest = report.get("guest_isolation_checks", [])
          if len(guest) != 3 or any(
              item.get("developer_workspace_passed") is not True
              or item.get("npm_install_passed") is not True
              or item.get("package_manifest_reported") is not True
              or item.get("npm_lock_sha256_reported") is not True
              or item.get("git_version_reported") is not True
              or item.get("python_version_reported") is not True
              or item.get("node_version_reported") is not True
              or item.get("npm_version_reported") is not True
              or item.get("host_surface_probes_passed") is not True
              or item.get("rootfs_read_only_confirmed") is not True
              or item.get("no_non_loopback_network_interfaces") is not True
              for item in guest
          ):
              raise SystemExit("Every jailed W2 guest must prove workspace and isolation markers.")
          processes = report.get("process_isolation_samples", [])
          if len(processes) != 3 or any(
              item.get("seccomp_mode") != 2
              or not item.get("thread_seccomp_modes")
              or any(mode != 2 for mode in item["thread_seccomp_modes"])
              or item.get("no_new_privs") is not True
              or item.get("capabilities_effective") != "0000000000000000"
              or item.get("pid_namespace_isolated") is not True
              or item.get("mount_namespace_isolated") is not True
              or item.get("network_namespace_isolated") is not True
              or not item.get("host_network_namespace")
              or item.get("host_network_namespace") == item.get("process_network_namespace")
              or item.get("network_interfaces") != ["lo"]
              for item in processes
          ):
              raise SystemExit("Every jailed W2 Firecracker process and thread must prove confinement.")
          cgroups = report.get("cgroup_limit_samples", [])
          expected = {"memory.max": "3221225472", "pids.max": "128", "cpu.max": "200000 100000"}
          if len(cgroups) != 3 or any(item != expected for item in cgroups):
              raise SystemExit("Every jailed W2 run must prove the configured cgroup v2 limits.")
          expected_rootfs = Path("artifacts/w2-rootfs.sha256").read_text(encoding="utf-8").strip()
          if report.get("w2_rootfs_tar_sha256") != expected_rootfs:
              raise SystemExit("Jailed W2 did not consume the exact shared normalized rootfs.")
          print("PASS: 3/3 W2 developer workspaces executed through Firecracker jailer.")
          print(f"Shared normalized rootfs SHA-256: {expected_rootfs}")
          print(f"Per-run process confinement: {processes}")
          print(f"Per-run cgroup limits: {cgroups}")
          PY

      - name: Upload jailed W2 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firecracker-jailer-w2-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Remove and verify ephemeral jailer resources
        if: always()
        run: |
          set -euo pipefail
          namespace="tinlance-fc-w2-${GITHUB_RUN_ID}"
          sudo rm -rf -- /srv/tinlance-jailer-w2
          if sudo ip netns list | awk '{print $1}' | grep -Fxq "${namespace}"; then
            namespace_pids="$(sudo ip netns pids "${namespace}")"
            if [[ -n "${namespace_pids}" ]]; then
              echo "network namespace still contains processes: ${namespace_pids}" >&2
              exit 1
            fi
            sudo ip netns del "${namespace}"
          fi
          if getent passwd "${namespace}" >/dev/null; then
            sudo userdel "${namespace}"
          fi
          if getent group "${namespace}" >/dev/null; then
            sudo groupdel "${namespace}"
          fi
          test ! -e "/var/run/netns/${namespace}"
          ! getent passwd "${namespace}" >/dev/null
          ! getent group "${namespace}" >/dev/null
          test ! -e /srv/tinlance-jailer-w2
          leftovers="$(sudo find /sys/fs/cgroup -type d -name "fc-${GITHUB_RUN_ID}-*" -print)"
          if [[ -n "${leftovers}" ]]; then
            echo "orphaned jailer cgroups remain: ${leftovers}" >&2
            exit 1
          fi
          echo "PASS: jailer process, cgroup, chroot, namespace, UID and GID resources removed."
