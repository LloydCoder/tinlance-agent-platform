name: Secret Scan

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository filesystem
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workdir:ro" \
            trufflesecurity/trufflehog:3.97.9 \
            filesystem /workdir --results=verified,unknown --fail
