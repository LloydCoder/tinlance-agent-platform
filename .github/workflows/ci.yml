name: CI
on:
  push:
    branches: [main, "feature/**", "m1-*", "phase/p3-*", "phase/fcp03-*"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[test,security]"
      - run: python -m pip check
      - run: python -m compileall -q packages tests
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages
      - run: pytest --cov=packages --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: python -m pip freeze | grep -vE '^(tinlance-agent-platform==|-e )' > /tmp/audit-requirements.txt
      - run: pip-audit --strict -r /tmp/audit-requirements.txt
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
  tsic-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify pinned TSIC ecosystem contract
        run: python scripts/tsic_conformance.py
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL integration test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[test]"
      - name: Apply migrations and isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          for test in database/tests/*.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$test"
          done
      - name: Run live PostgreSQL adapter integration tests
        env:
          FCP03_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q tests/integration/test_postgres_durability_live.py
  fcp03-linux-dns-egress:
    name: FCP-03 Linux DNS/egress namespace lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated namespace lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes dnsmasq-base dnsutils iproute2 nftables openssl python3
      - name: Run disposable DNS and egress enforcement lab
        run: sudo bash scripts/fcp03_linux_dns_egress_lab.sh
